<title>Calorif Suivi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    color-scheme: light;
    --page:#eef0ee;
    --page-line: rgba(18,24,26,0.05);
    --surface:#ffffff;
    --surface-2:#f6f7f6;
    --surface-3:#ecefee;
    --ink-primary:#12181a;
    --ink-secondary:#4b5658;
    --ink-muted:#7c8688;
    --line:#d7dcda;
    --line-strong:#b9c0be;
    --accent:#c9691b;
    --accent-ink:#1a1206;
    --accent-soft:#f4e3d0;
    --cold:#2a6ca8;
    --cold-soft:#dbe9f4;
    --warm:#c9691b;
    --warm-soft:#f4e3d0;
    --good:#0ca30c;
    --good-soft:#e0f3df;
    --warning:#a86200;
    --warning-soft:#fbe9cf;
    --critical:#c53a3a;
    --critical-soft:#fbe1e1;
    --shadow: 0 1px 2px rgba(18,24,26,0.06), 0 6px 20px -8px rgba(18,24,26,0.16);
    --font-display:'Archivo', 'Arial Narrow', sans-serif;
    --font-body:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --page:#0f1213;
      --page-line: rgba(255,255,255,0.045);
      --surface:#171d1f;
      --surface-2:#1c2224;
      --surface-3:#222a2c;
      --ink-primary:#f0f3f2;
      --ink-secondary:#aab4b4;
      --ink-muted:#78827f;
      --line:#2b3335;
      --line-strong:#3a4547;
      --accent:#e08a3e;
      --accent-ink:#1a1206;
      --accent-soft:#3a2a17;
      --cold:#5c9bd6;
      --cold-soft:#1c2c3a;
      --warm:#e08a3e;
      --warm-soft:#3a2a17;
      --good:#3fc23f;
      --good-soft:#173a17;
      --warning:#e0a439;
      --warning-soft:#3a2f14;
      --critical:#e2696b;
      --critical-soft:#3a1c1c;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 24px -10px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page:#0f1213;
    --page-line: rgba(255,255,255,0.045);
    --surface:#171d1f;
    --surface-2:#1c2224;
    --surface-3:#222a2c;
    --ink-primary:#f0f3f2;
    --ink-secondary:#aab4b4;
    --ink-muted:#78827f;
    --line:#2b3335;
    --line-strong:#3a4547;
    --accent:#e08a3e;
    --accent-ink:#1a1206;
    --accent-soft:#3a2a17;
    --cold:#5c9bd6;
    --cold-soft:#1c2c3a;
    --warm:#e08a3e;
    --warm-soft:#3a2a17;
    --good:#3fc23f;
    --good-soft:#173a17;
    --warning:#e0a439;
    --warning-soft:#3a2f14;
    --critical:#e2696b;
    --critical-soft:#3a1c1c;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 24px -10px rgba(0,0,0,0.6);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      repeating-linear-gradient(0deg, var(--page-line) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, var(--page-line) 0 1px, transparent 1px 28px),
      var(--page);
    color:var(--ink-primary);
    font-family:var(--font-body);
    font-size:14.5px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:var(--font-display); font-weight:800; letter-spacing:0.01em; text-wrap:balance; margin:0; }
  .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  a{ color:inherit; }
  ::selection{ background:var(--accent-soft); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

  #app{ display:flex; min-height:100%; }

  /* ---------- Sidebar ---------- */
  .rail{
    width:250px; flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .rail-brand{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--line);
  }
  .rail-brand .mark{
    display:flex; align-items:center; gap:10px;
  }
  .rail-brand .mark-icon{
    width:34px; height:34px; border-radius:8px;
    background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .rail-brand .mark-icon svg{ width:19px; height:19px; }
  .rail-brand .word{
    font-family:var(--font-display); font-weight:900; font-size:15.5px;
    letter-spacing:0.06em; text-transform:uppercase; line-height:1.15;
  }
  .rail-brand .sub{
    font-size:10.5px; color:var(--ink-muted); letter-spacing:0.08em;
    text-transform:uppercase; margin-top:2px;
  }
  .rail-nav{ padding:14px 12px; display:flex; flex-direction:column; gap:2px; }
  .rail-nav button{
    display:flex; align-items:center; gap:10px;
    padding:9px 12px; border-radius:7px; border:none; background:none;
    color:var(--ink-secondary); font-size:13.5px; font-weight:500;
    cursor:pointer; text-align:left; width:100%;
  }
  .rail-nav button svg{ width:16px; height:16px; flex-shrink:0; opacity:0.85; }
  .rail-nav button:hover{ background:var(--surface-2); color:var(--ink-primary); }
  .rail-nav button.active{ background:var(--accent-soft); color:var(--accent-ink); }
  :root[data-theme="dark"] .rail-nav button.active, @media (prefers-color-scheme:dark){ }
  .rail-nav button.active{ color:var(--accent); background:var(--accent-soft); }

  .rail-list{ flex:1; overflow-y:auto; padding:4px 12px 12px; }
  .rail-list-title{
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.09em;
    color:var(--ink-muted); padding:14px 12px 6px;
  }
  .rail-item{
    display:flex; flex-direction:column; gap:3px;
    padding:8px 12px; border-radius:7px; cursor:pointer;
    border:1px solid transparent;
  }
  .rail-item:hover{ background:var(--surface-2); }
  .rail-item.active{ background:var(--surface-2); border-color:var(--line); }
  .rail-item .rt{ font-size:12.5px; font-weight:600; color:var(--ink-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rail-item .rb{ font-size:11px; color:var(--ink-muted); display:flex; align-items:center; gap:6px; }

  .rail-foot{
    padding:12px 20px 16px; border-top:1px solid var(--line);
    font-size:10.5px; color:var(--ink-muted); line-height:1.5;
  }

  /* ---------- Main ---------- */
  .main{ flex:1; min-width:0; padding:28px 34px 60px; max-width:1180px; }
  .topbar{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:16px; margin-bottom:22px; flex-wrap:wrap;
  }
  .topbar .eyebrow{
    font-size:11px; text-transform:uppercase; letter-spacing:0.1em;
    color:var(--ink-muted); margin-bottom:4px;
  }
  .topbar h1{ font-size:24px; }
  .topbar-actions{ display:flex; gap:8px; }

  .btn{
    display:inline-flex; align-items:center; gap:7px;
    padding:9px 15px; border-radius:8px; border:1px solid var(--line-strong);
    background:var(--surface); color:var(--ink-primary);
    font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .btn svg{ width:14px; height:14px; }
  .btn:hover{ background:var(--surface-2); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-ghost{ border-color:transparent; background:transparent; }
  .btn-ghost:hover{ background:var(--surface-2); }
  .btn-sm{ padding:6px 11px; font-size:12px; }
  .btn-danger{ color:var(--critical); }

  /* Panel = "instrument bezel" card */
  .panel{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:var(--shadow);
    padding:20px 22px;
  }
  .panel::before, .panel::after,
  .panel .tick-br, .panel .tick-bl{
    content:''; position:absolute; width:9px; height:9px;
    border-color:var(--line-strong); pointer-events:none;
  }
  .panel::before{ top:-1px; left:-1px; border-top:2px solid; border-left:2px solid; border-radius:3px 0 0 0; }
  .panel::after{ top:-1px; right:-1px; border-top:2px solid; border-right:2px solid; border-radius:0 3px 0 0; }
  .panel .tick-bl{ bottom:-1px; left:-1px; border-bottom:2px solid var(--line-strong); border-left:2px solid var(--line-strong); border-radius:0 0 0 3px; }
  .panel .tick-br{ bottom:-1px; right:-1px; border-bottom:2px solid var(--line-strong); border-right:2px solid var(--line-strong); border-radius:0 0 3px 0; }

  .panel-title{
    font-size:11px; text-transform:uppercase; letter-spacing:0.09em;
    color:var(--ink-muted); font-weight:600; margin-bottom:14px;
    display:flex; align-items:center; justify-content:space-between;
  }

  .grid{ display:grid; gap:16px; }
  .g2{ grid-template-columns:1fr 1fr; }
  .g3{ grid-template-columns:1fr 1fr 1fr; }
  @media (max-width:900px){ .g2,.g3{ grid-template-columns:1fr; } }

  .stack{ display:flex; flex-direction:column; gap:16px; }

  /* Dashboard */
  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
  @media (max-width:900px){ .kpi-row{ grid-template-columns:repeat(2,1fr); } }
  .kpi{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:16px 18px;
  }
  .kpi .kv{ font-family:var(--font-mono); font-size:26px; font-weight:600; line-height:1; }
  .kpi .kl{ font-size:11.5px; color:var(--ink-muted); margin-top:8px; }

  .mini-row{ display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
  @media (max-width:900px){ .mini-row{ grid-template-columns:repeat(2,1fr); } }
  .mini{ background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:11px 13px; }
  .mini .mv{ font-family:var(--font-mono); font-size:16.5px; font-weight:600; line-height:1.15; }
  .mini .ml{ font-size:10.5px; color:var(--ink-muted); margin-top:5px; }

  table{ border-collapse:collapse; width:100%; font-size:13px; }
  th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-muted); font-weight:600; padding:0 10px 8px; border-bottom:1px solid var(--line); }
  td{ padding:10px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  .dossier-row{ cursor:pointer; }
  .dossier-row:hover{ background:var(--surface-2); }
  .cell-strong{ font-weight:600; }
  .cell-muted{ color:var(--ink-muted); font-size:12px; }
  .table-scroll{ overflow-x:auto; }

  .pill{
    display:inline-flex; align-items:center; gap:6px;
    padding:4px 10px 4px 8px; border-radius:99px; font-size:11.5px; font-weight:600;
    white-space:nowrap;
  }
  .pill .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .pill-planifie{ background:var(--surface-3); color:var(--ink-secondary); }
  .pill-avant{ background:var(--cold-soft); color:var(--cold); }
  .pill-calorifuge{ background:var(--warm-soft); color:var(--warm); }
  .pill-apres{ background:var(--warm-soft); color:var(--warm); }
  .pill-pret{ background:var(--good-soft); color:var(--good); }

  .badge-good{ background:var(--good-soft); color:var(--good); }
  .badge-warn{ background:var(--warning-soft); color:var(--warning); }
  .badge{ display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:8px; font-size:12.5px; font-weight:700; }
  .badge svg{ width:14px; height:14px; }

  .empty{
    text-align:center; padding:50px 20px; color:var(--ink-muted);
  }
  .empty svg{ width:34px; height:34px; opacity:0.4; margin-bottom:10px; }

  /* Form */
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:11.5px; font-weight:600; color:var(--ink-secondary); display:flex; align-items:center; justify-content:space-between; }
  .field .hint{ font-weight:400; color:var(--ink-muted); font-size:10.5px; }
  .ac-wrap{ position:relative; }
  .ac-list{
    position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:40;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    box-shadow:0 10px 28px rgba(0,0,0,0.16); max-height:230px; overflow-y:auto; padding:4px;
  }
  .ac-item{ display:flex; justify-content:space-between; gap:10px; padding:7px 9px; border-radius:7px; font-size:12.5px; cursor:pointer; }
  .ac-item:hover, .ac-item.active{ background:var(--surface-2); }
  .ac-item .ac-cp{ font-family:var(--font-mono); color:var(--ink-muted); font-size:11px; }
  .ac-empty{ padding:8px 10px; font-size:11.5px; color:var(--ink-muted); }
  input[type=text], input[type=number], input[type=date], input[type=tel], input[type=email], textarea, select{
    font-family:var(--font-body); font-size:13.5px; color:var(--ink-primary);
    background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
    padding:9px 11px; width:100%;
  }
  input.mono-input{ font-family:var(--font-mono); }
  input:focus, textarea:focus, select:focus{ outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent); background:var(--surface); }
  textarea{ resize:vertical; min-height:64px; }

  .section-head{ display:flex; align-items:center; gap:9px; margin-bottom:2px; }
  .section-num{
    font-family:var(--font-mono); font-size:11px; font-weight:600;
    width:22px; height:22px; border-radius:50%; background:var(--surface-3);
    color:var(--ink-secondary); display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .section-title{ font-family:var(--font-display); font-weight:800; font-size:15px; }
  .section-desc{ font-size:12px; color:var(--ink-muted); margin:2px 0 0 31px; }

  /* Vanne balancing table — tightened so it fits without horizontal
     scrolling on a normal laptop width; .table-scroll stays as a safety
     net for narrower windows. */
  .vanne-table{ min-width:0; width:100%; table-layout:fixed; }
  .vanne-table th, .vanne-table td{ padding:4px 3px; white-space:nowrap; }
  .vanne-table thead tr:first-child th{ border-bottom:1px solid var(--line); }
  .vanne-table thead tr:last-child th{ font-size:9.5px; font-weight:600; color:var(--ink-muted); text-transform:none; letter-spacing:0; }
  .vanne-table th.grp{ text-align:center; font-size:10px; letter-spacing:0.03em; border-radius:4px 4px 0 0; }
  .vanne-table th.grp-avant{ background:var(--cold-soft); color:var(--cold); }
  .vanne-table th.grp-apres{ background:var(--warm-soft); color:var(--warm); }
  .vanne-table input, .vanne-table select{ padding:4px 3px; font-size:11.5px; width:100%; box-sizing:border-box; }
  .vanne-table .rm-btn{ background:none; border:none; color:var(--ink-muted); cursor:pointer; padding:2px; }
  .vanne-table .rm-btn:hover{ color:var(--critical); }
  .vanne-table .delta-cell{ text-align:center; font-size:11.5px; }

  /* Tableau du rapport (lecture seule) — même logique que .vanne-table :
     largeurs proportionnelles + table-layout:fixed pour tenir sans scroll
     horizontal dans le panneau. */
  .report-vanne-table{ width:100%; table-layout:fixed; }
  .report-vanne-table th.grp-avant{ background:var(--cold-soft); color:var(--cold); }
  .report-vanne-table th.grp-apres{ background:var(--warm-soft); color:var(--warm); }
  .report-vanne-table th, .report-vanne-table td{ padding:5px 4px; font-size:11.5px; white-space:normal; overflow-wrap:break-word; word-break:break-word; }
  .report-vanne-table th.grp{ text-align:center; font-size:10px; letter-spacing:0.03em; }
  .report-vanne-table thead tr:last-child th{ font-size:9.5px; font-weight:600; color:var(--ink-muted); text-transform:none; letter-spacing:0; }

  /* Points de mesure + logs de température (avant/après) */
  .points-table{ min-width:640px; }
  .points-table th, .points-table td, .log-table th, .log-table td{ padding:6px 7px; white-space:nowrap; }
  .points-table input, .points-table select, .log-table input{ padding:5px 6px; font-size:12.5px; }
  .points-table .rm-btn, .log-table .rm-btn{ background:none; border:none; color:var(--ink-muted); cursor:pointer; padding:4px; }
  .points-table .rm-btn:hover, .log-table .rm-btn:hover{ color:var(--critical); }
  .log-table{ min-width:920px; }
  .log-table thead tr:last-child th{ font-size:10px; font-weight:600; color:var(--ink-muted); text-transform:none; letter-spacing:0; }
  .log-table th.grp-amb{ text-align:center; font-size:10.5px; letter-spacing:0.04em; background:var(--surface-3); color:var(--ink-secondary); }
  .log-table input[data-k="date"]{ width:88px; }
  .log-table input[data-k="heure"]{ width:70px; }
  .log-table .amb-input{ width:56px; }
  .log-panel-avant .panel-title{ color:var(--cold); }
  .log-panel-apres .panel-title{ color:var(--warm); }

  /* Photos */
  .photo-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:760px){ .photo-grid{ grid-template-columns:1fr; } }
  .photo-slot{
    border:1.5px dashed var(--line-strong); border-radius:10px;
    aspect-ratio:4/3; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; cursor:pointer; position:relative; overflow:hidden; background:var(--surface-2);
    text-align:center; padding:10px;
  }
  .photo-slot:hover{ border-color:var(--accent); }
  .photo-slot input{ display:none; }
  .photo-slot svg{ width:22px; height:22px; color:var(--ink-muted); }
  .photo-slot .pl{ font-size:11.5px; font-weight:600; color:var(--ink-secondary); }
  .photo-slot .ps{ font-size:10px; color:var(--ink-muted); }
  .photo-slot img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .photo-slot .cap{
    position:absolute; bottom:0; left:0; right:0; background:rgba(10,14,15,0.72); color:#fff;
    font-size:10px; padding:5px 8px; display:flex; justify-content:space-between; align-items:center;
  }
  .photo-slot .cap button{ background:none; border:none; color:#fff; font-size:10px; cursor:pointer; text-decoration:underline; }

  /* Photos complémentaires (vannes, équipements…) — liste ouverte, avec
     horodatage/adresse/coordonnées superposés sur chaque vignette. */
  .photo-extra-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; align-items:start; }
  @media (max-width:760px){ .photo-extra-grid{ grid-template-columns:1fr; } }
  .photo-extra-card{ display:flex; flex-direction:column; gap:6px; }
  .photo-extra-thumb{
    position:relative; aspect-ratio:4/3; border-radius:10px; overflow:hidden;
    background:var(--surface-2); border:1px solid var(--line);
  }
  .photo-extra-thumb img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .photo-extra-thumb .geostamp{
    position:absolute; left:0; right:0; bottom:0; padding:16px 9px 7px;
    background:linear-gradient(to top, rgba(8,10,10,.78), rgba(8,10,10,.5) 55%, transparent);
    pointer-events:none;
  }
  .photo-extra-thumb .geostamp .gs-line{
    font-size:9.5px; line-height:1.4; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.6);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .photo-extra-thumb .geostamp .gs-date{ font-weight:700; letter-spacing:.02em; }
  .photo-extra-thumb .geostamp .gs-coords{ font-family:var(--font-mono); opacity:.92; }
  .photo-extra-rm{
    position:absolute; top:6px; right:6px; width:22px; height:22px; border-radius:50%;
    background:rgba(10,14,15,.6); border:none; color:#fff; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .photo-extra-rm svg{ width:12px; height:12px; }
  .photo-extra-rm:hover{ background:rgba(190,40,40,.85); }
  .photo-extra-label{ font-size:11.5px; padding:6px 8px; }
  .photo-extra-add .ps{ font-size:9.5px; }
  .report-photo-caption{ font-size:11px; color:var(--ink-secondary); font-weight:600; padding:0 1px; }

  /* Schéma synoptique hydraulique — champs (+ dictée vocale) et aperçu SVG */
  .synop-fields{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  @media (max-width:760px){ .synop-fields{ grid-template-columns:1fr; } }
  .synop-field-row{ display:flex; gap:6px; }
  .synop-field-row input{ flex:1; min-width:0; }
  .mic-btn{
    flex:0 0 auto; width:38px; border-radius:8px; border:1px solid var(--line-strong);
    background:var(--surface-2); color:var(--ink-secondary); cursor:pointer;

  function normStr(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
  function matchCommunes(q, limit){
    q = normStr(q).trim();
    if (!q) return [];
    const starts = [], contains = [];
    const seen = new Set();
    COMMUNES.forEach(([cp,ville]) => {
      const key = cp+'|'+ville;
      if (seen.has(key)) return;
      const nv = normStr(ville);
      if (cp.startsWith(q) || nv.startsWith(q)){ starts.push([cp,ville]); seen.add(key); }
      else if (nv.includes(q)){ contains.push([cp,ville]); seen.add(key); }
    });
    return starts.concat(contains).slice(0, limit || 8);
  }
  // Base Adresse Nationale (api-adresse.data.gouv.fr) — free, no API key,
  // full national address database. Only reachable when this page is
  // self-hosted outside the Artifact sandbox (fetch to external hosts is
  // blocked there). Resolves to `null` when the call fails/times out
  // (network error OR a silently-swallowed CSP block) so callers can fall
  // back to the small embedded dataset — vs. an empty array, which means
  // "reached the API, no match". A manual timeout race guards against CSP
  // blocks that never fire a rejection at all.
  function banSearch(query, opts){
    opts = opts || {};
    const q = String(query || '').trim();
    if (q.length < 3) return Promise.resolve([]);
    const params = new URLSearchParams({ q, limit: String(opts.limit || 6), autocomplete: '1' });
    if (opts.type) params.set('type', opts.type);
    const url = 'https://api-adresse.data.gouv.fr/search/?' + params.toString();
    const fetchP = fetch(url, { headers: { Accept: 'application/json' } })
      .then(r => r.ok ? r.json() : Promise.reject(new Error('ban-http-' + r.status)))
      .then(data => (data.features || []).map(f => ({
        label: f.properties.label,
        rue: f.properties.name || '',
        cp: f.properties.postcode || '',
        ville: f.properties.city || f.properties.name || '',
        lat: f.geometry && f.geometry.coordinates ? f.geometry.coordinates[1] : null,
        lng: f.geometry && f.geometry.coordinates ? f.geometry.coordinates[0] : null,
      })));
    const timeoutP = new Promise((_, reject) => setTimeout(() => reject(new Error('ban-timeout')), opts.timeoutMs || 3500));
    return Promise.race([fetchP, timeoutP]).catch(() => null);
  }

  // Writes resolved address/geo values into both S.draft and the visible
  // form inputs, then refreshes the cadastral panel if the coordinates
  // changed (programmatic .value writes don't fire native 'input' events),
  // and kicks off an automatic cadastral-parcel lookup for the new point.
  function setAdresseFields(vals){
    const d = S.draft;
    if (vals.rue !== undefined){ d.adresse.rue = vals.rue; const el = document.getElementById('f-rue'); if (el) el.value = vals.rue; }
    if (vals.cp !== undefined){ d.adresse.cp = vals.cp; const el = document.getElementById('f-cp'); if (el) el.value = vals.cp; }
    if (vals.ville !== undefined){ d.adresse.ville = vals.ville; const el = document.getElementById('f-ville'); if (el) el.value = vals.ville; }
    let geoChanged = false;
    if (vals.lat != null && isFinite(vals.lat)){ d.lat = String(vals.lat); const el = document.getElementById('f-lat'); if (el) el.value = d.lat; geoChanged = true; }
    if (vals.lng != null && isFinite(vals.lng)){ d.lng = String(vals.lng); const el = document.getElementById('f-lng'); if (el) el.value = d.lng; geoChanged = true; }
    if (geoChanged){
      renderGeoPreview();
      lookupParcelleForDraft();
    }
  }

  // IGN Apicarto — module cadastre: given a point, returns the official
  // cadastral parcel(s) covering it (section + numéro + commune). Same
  // silent-CSP-block guard as banSearch (manual timeout race), and same
  // self-hosted-only reach: unreachable inside the Artifact sandbox.
  function ignParcelleAt(lat, lng){
    const geom = JSON.stringify({ type: 'Point', coordinates: [lng, lat] });
    const url = 'https://apicarto.ign.fr/api/cadastre/parcelle?geom=' + encodeURIComponent(geom) + '&_limit=1';
    const fetchP = fetch(url, { headers: { Accept: 'application/json' } })
      .then(r => r.ok ? r.json() : Promise.reject(new Error('ign-http-' + r.status)))
      .then(data => {
        const f = data.features && data.features[0];
        if (!f) return null;
        const p = f.properties || {};
        const insee = String(p.code_dep || '') + String(p.code_com || '');
        const section = p.section || '';
        const numero = p.numero ? String(p.numero).padStart(4, '0') : '';
        if (!section && !numero) return null;
        return { ref: [insee, section, numero].filter(Boolean).join('/'), section, numero, insee };
      });
    const timeoutP = new Promise((_, reject) => setTimeout(() => reject(new Error('ign-timeout')), 3500));
    return Promise.race([fetchP, timeoutP]).catch(() => null);
  }

  // Looks up the parcel under the draft's current lat/lng and fills
  // "Référence cadastrale" automatically. Silently does nothing when the
  // lookup is unreachable (sandboxed preview) or the point moved on again
  // before the response came back (stale-response guard).
  function lookupParcelleForDraft(){
    const d = S.draft;
    const lat = parseFloat(d.lat), lng = parseFloat(d.lng);
    if (!isFinite(lat) || !isFinite(lng)) return;
    const reqLat = d.lat, reqLng = d.lng;
    ignParcelleAt(lat, lng).then(res => {
      if (!res) return;
      if (S.draft !== d || d.lat !== reqLat || d.lng !== reqLng) return;
      d.refCadastrale = res.ref;
      const el = document.getElementById('f-refcad');
      if (el) el.value = res.ref;
      renderGeoPreview();
    });
  }

  function attachAddressAutocomplete(){
    const rueInput = document.getElementById('f-rue');
    const cpInput = document.getElementById('f-cp');
    const villeInput = document.getElementById('f-ville');
    const rueList = document.getElementById('ac-rue');
    const cpList = document.getElementById('ac-cp');
    const villeList = document.getElementById('ac-ville');
    if (!cpInput || !villeInput || !cpList || !villeList) return;

    function closeAll(){ [rueList, cpList, villeList].forEach(l => { if (l) l.hidden = true; }); }

    function debounce(fn, ms){
      let t = null;
      return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }

    // Generic autocomplete wiring: `resolver(query)` returns an array or a
    // Promise<array> of `{label, sub, data}`; `onPick(data)` applies a
    // chosen suggestion.
    function wire(input, listEl, resolver, onPick){
      if (!input || !listEl) return;
      let items = [], active = -1, reqId = 0;

      function paint(){
        const els = listEl.querySelectorAll('.ac-item');
        els.forEach((el,i) => el.classList.toggle('active', i===active));
      }
      function renderItems(list){
        items = list || [];
        active = -1;
        if (!items.length){ listEl.hidden = true; listEl.innerHTML = ''; return; }
        listEl.innerHTML = items.map((it,i) =>
          `<div class="ac-item" data-i="${i}"><span>${esc(it.label)}</span>${it.sub ? `<span class="ac-cp">${esc(it.sub)}</span>` : ''}</div>`
        ).join('');
        listEl.hidden = false;
      }
      function pick(it){
        onPick(it.data);
        closeAll();
      }
      const doSearch = debounce((q) => {
        const myReq = ++reqId;
        Promise.resolve(resolver(q)).then(list => { if (myReq === reqId) renderItems(list); });
      }, 220);

      input.addEventListener('input', () => {
        const q = input.value;
        if (!q || q.trim().length < 2){ listEl.hidden = true; return; }
        doSearch(q);
      });
      input.addEventListener('focus', () => { if (input.value && input.value.trim().length >= 2) doSearch(input.value); });
      input.addEventListener('keydown', (e) => {
        if (listEl.hidden) return;
        if (e.key === 'ArrowDown'){ e.preventDefault(); active = Math.min(active+1, items.length-1); paint(); }
        else if (e.key === 'ArrowUp'){ e.preventDefault(); active = Math.max(active-1, 0); paint(); }
        else if (e.key === 'Enter'){ if (active>=0){ e.preventDefault(); pick(items[active]); } }
        else if (e.key === 'Escape'){ listEl.hidden = true; }
      });
      input.addEventListener('blur', () => setTimeout(() => { listEl.hidden = true; }, 120));
      listEl.addEventListener('mousedown', (e) => {
        const item = e.target.closest('.ac-item');
        if (!item) return;
        e.preventDefault();
        pick(items[Number(item.dataset.i)]);
      });
    }

    // Ville / Code postal: try the national BAN database first, fall back
    // to the small embedded city list when BAN is unreachable (e.g. the
    // sandboxed Artifact preview) or returns nothing.
    function communeResolver(q){
      return banSearch(q, { type: 'municipality', limit: 7 }).then(res => {
        if (res && res.length) return res.map(r => ({ label: r.ville, sub: r.cp, data: r }));
        return matchCommunes(q).map(([cp,ville]) => ({ label: ville, sub: cp, data: { cp, ville } }));
      });
    }
    function communePick(data){
      setAdresseFields({ cp: data.cp, ville: data.ville, lat: data.lat, lng: data.lng });
    }
    wire(cpInput, cpList, communeResolver, communePick);
    wire(villeInput, villeList, communeResolver, communePick);

    // Adresse (rue, n°): full national address search via BAN. No local
    // dataset exists at street level, so this only produces suggestions
    // when BAN is actually reachable (i.e. self-hosted, not the Artifact
    // preview) — the field still works as a plain text input otherwise.
    if (rueInput && rueList){
      wire(rueInput, rueList, (q) => banSearch(q, { limit: 6 }).then(res => (res || []).map(r => ({ label: r.label, sub: '', data: r }))),
        (data) => setAdresseFields({ rue: data.rue, cp: data.cp, ville: data.ville, lat: data.lat, lng: data.lng }));
    }
  }

  // Bouton "loupe" à côté du champ Ville : déclenche manuellement une
  // recherche BAN sur l'adresse complète telle que tapée (rue + CP + ville),
  // sans attendre que l'utilisateur clique une suggestion — utile s'il tape
  // l'adresse d'un coup puis clique ailleurs. Applique lat/lng puis, via
  // setAdresseFields, relance automatiquement la recherche de la référence
  // cadastrale et le rafraîchissement du plan.
  function attachGeocodeButton(){
    const btn = document.getElementById('btn-geocode');
    const status = document.getElementById('geocode-status');
    if (!btn) return;
    btn.addEventListener('click', async () => {
      const rue = (document.getElementById('f-rue') || {}).value || '';
      const cp = (document.getElementById('f-cp') || {}).value || '';
      const ville = (document.getElementById('f-ville') || {}).value || '';
      const q = [rue, cp, ville].filter(Boolean).join(' ').trim();
      if (!q){ if (status) status.textContent = 'Renseignez au moins la rue ou la ville avant de rechercher.'; return; }
      btn.disabled = true;
      if (status) status.textContent = 'Recherche en cours…';
      const res = await banSearch(q, { limit: 1 });
      btn.disabled = false;
      if (res === null){ if (status) status.textContent = "Service d'adresse injoignable ici — fonctionne une fois le site auto-hébergé (GitHub Pages)."; return; }
      if (!res.length){ if (status) status.textContent = 'Adresse introuvable — vérifiez la saisie.'; return; }
      const r = res[0];
      setAdresseFields({ rue: r.rue || rue, cp: r.cp || cp, ville: r.ville || ville, lat: r.lat, lng: r.lng });
      if (status) status.textContent = 'Coordonnées mises à jour — recherche de la référence cadastrale…';
      if (isFinite(r.lat) && isFinite(r.lng)){
        const check = () => {
          if (S.draft && String(S.draft.lat) === String(r.lat)){
            if (status) status.textContent = S.draft.refCadastrale ? 'Coordonnées et référence cadastrale mises à jour.' : 'Coordonnées mises à jour (parcelle non trouvée — service injoignable ou hors zone).';
          }
        };
        setTimeout(check, 3800);
      }
    });
  }

  function upsertLocal(d){
    S.dossiers[d.id] = d;
    if (!S.order.includes(d.id)) S.order.unshift(d.id);
  }

  function sortedDossiers(){
    return S.order
      .map(id => S.dossiers[id])
      .filter(Boolean)
      .sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  }

  /* ============================= PERSISTENCE ============================= */
  async function initCapabilities(){
    try{
      if (window.claude && typeof window.claude.use === 'function'){
        const [db, downloads] = await Promise.all([
          window.claude.use('db').catch(()=>null),
          window.claude.use('downloads').catch(()=>null),
        ]);
        S.db = db; S.downloads = downloads;
      }
    }catch(e){ /* design for absence */ }

    if (S.db){
      try{
        S.db.collection('dossiers').onSnapshot(
          (snap) => {
            const map = {};
            const order = [];
            snap.docs.forEach(doc => {
              const data = doc.data();
              if (!data) return;
              map[doc.id] = Object.assign({ id: doc.id }, data);
              order.push(doc.id);
            });
            // first delivery: if store empty, seed it
            if (!S.dbReady && snap.empty){
              seedDossiers().forEach(d => S.db.collection('dossiers').doc(d.id).set(stripId(d)).catch(()=>{}));
            } else {
              S.dossiers = map;
              S.order = order;
            }
            S.dbReady = true;
            render();
          },
          (err) => { console.warn('db error', err); if(!S.dbReady){ seedDossiers().forEach(upsertLocal); S.dbReady=true; render(); } }
        );
      }catch(e){
        seedDossiers().forEach(upsertLocal); S.dbReady = true; render();
      }
    } else {
      seedDossiers().forEach(upsertLocal);
      S.dbReady = true;
      render();
    }
  }

  function stripId(d){ const c = Object.assign({}, d); delete c.id; return c; }

  async function saveDossier(d){
    upsertLocal(d);
    if (S.db){
      try{
        await S.db.collection('dossiers').doc(d.id).set(stripId(d));
      }catch(e){
        if (e && e.code === 'invalid_argument'){
          toast('Dossier trop volumineux — réduisez la taille des photos.');
        } else {
          toast('Enregistrement local (synchronisation indisponible).');
        }
      }
    }
    render();
  }

  async function deleteDossier(id){
    delete S.dossiers[id];
    S.order = S.order.filter(x => x !== id);
    if (S.db){ try{ await S.db.collection('dossiers').doc(id).delete(); }catch(e){} }
    render();
  }

  function normalizeDossier(d){
    if (d.technicienId == null) d.technicienId = '';
    if (!d.typeLogement || typeof d.typeLogement !== 'object'){
      d.typeLogement = { nbLogements:'', typeEnergie:'CPCU', surfaceM2:'', nbSousStations:'', tempExterieure:'' };
    }
    if (!Array.isArray(d.vannes)) d.vannes = [];
    if (!Array.isArray(d.pointsTemp)) d.pointsTemp = [];
    if (!Array.isArray(d.logsAvant)) d.logsAvant = [];
    if (!Array.isArray(d.logsApres)) d.logsApres = [];
    if (!Array.isArray(d.photosExtra)) d.photosExtra = [];
    if (!d.synoptique || typeof d.synoptique !== 'object'){
      d.synoptique = { nbBatiments:'', nbChauffage:'', nbVannes:'' };
    }
    d.logsAvant.forEach(r => { if (!Array.isArray(r.amb)) r.amb = [null,null,null,null,null]; });
    d.logsApres.forEach(r => { if (!Array.isArray(r.amb)) r.amb = [null,null,null,null,null]; });
    return d;

  /* ============================= STATS ============================= */
  // Plain-text label for a measurement point (used in stats/chart; escaped at render time).
  function pointLabelRaw(p, i){
    if (!p) return 'Point ' + (i+1);
    return p.niveau || p.batiment || ('Point ' + (i+1));
  }
  // Mean of the i-th ambient reading across a set of log rows (nulls ignored).
  function avgAmbientAt(logRows, i){
    const vals = (logRows||[]).map(r => r.amb && r.amb[i]).filter(v => v!=null && v!=='');
    if (!vals.length) return null;
    return vals.reduce((a,b)=>a+Number(b),0) / vals.length;
  }

  function computeStats(d){
    const points = d.pointsTemp || [];
    if (!points.length) return null;
    const rows = points.map((p,i) => ({
      label: pointLabelRaw(p, i),
      avant: avgAmbientAt(d.logsAvant, i),
      apres: avgAmbientAt(d.logsApres, i),
    })).filter(r => r.avant!=null && r.apres!=null);
    if (!rows.length) return null;
    const av = rows.map(r=>Number(r.avant));
    const ap = rows.map(r=>Number(r.apres));
    const ecartAvant = Math.max(...av) - Math.min(...av);
    const ecartApres = Math.max(...ap) - Math.min(...ap);
    const reduction = ecartAvant > 0 ? ((ecartAvant - ecartApres) / ecartAvant) * 100 : 0;
    const gains = rows.map(r => Number(r.apres) - Number(r.avant));
    const gainMoyen = gains.reduce((a,b)=>a+b,0) / gains.length;
    const inBand = (v) => v >= 19 && v <= 23;
    const confortAvant = av.filter(inBand).length / av.length * 100;
    const confortApres = ap.filter(inBand).length / ap.length * 100;
    const beneficial = ecartApres < ecartAvant && gainMoyen >= -0.2;
    return { rows, ecartAvant, ecartApres, reduction, gainMoyen, confortAvant, confortApres, beneficial, n: rows.length };
  }

  async function compressImage(file, maxDim, quality){
    maxDim = maxDim || 520; quality = quality || 0.55;
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    const img = await new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = reject;
      im.src = dataUrl;
    });
    let w = img.width, h = img.height;
    if (w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
    else if (h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    return canvas.toDataURL('image/jpeg', quality);
  }

  function deltaT(depart, retour){
    if (depart==null || retour==null || depart==='' || retour==='') return null;
    return Number(depart) - Number(retour);
  }
  function deltaCellHtml(depart, retour){
    const dv = deltaT(depart, retour);
    if (dv==null) return `<span class="mono" style="color:var(--ink-muted);">—</span>`;
    const color = dv >= 0 ? 'var(--good)' : 'var(--critical)';
    return `<span class="mono" style="font-weight:600; color:${color};">${dv>0?'+':''}${fmt1(dv)}</span>`;
  }

  // aléatoire à 3 chiffres) quand le champ est laissé vide à l'enregistrement.
  function generateNumeroDossier(){
    const now = new Date();
    const yyyy = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    const seq = String(Math.floor(Math.random() * 900) + 100);
    return `${yyyy}-${mm}${dd}${seq}`;
  }

  function officialCadastreLinks(d){
    const lat = parseFloat(d.lat), lng = parseFloat(d.lng);
    const hasCoords = isFinite(lat) && isFinite(lng);
    const geoportailUrl = hasCoords
      ? `https://www.geoportail.gouv.fr/carte?c=${lng.toFixed(6)},${lat.toFixed(6)}&z=19&l0=CADASTRALPARCELS.PARCELLAIRE_EXPRESS::GEOPORTAIL:OGC:WMTS(1)&permalink=yes`

    const cadastreUrl = 'https://www.cadastre.gouv.fr/';
    return `
    <div class="cadastre-links">
      ${geoportailUrl ? `<a class="btn btn-sm" href="${geoportailUrl}" target="_blank" rel="noopener">${icon('ext')} Voir sur Géoportail</a>` : `<span class="btn btn-sm" style="opacity:.5; pointer-events:none;">${icon('ext')} Voir sur Géoportail</span>`}
      <a class="btn btn-sm btn-ghost" href="${cadastreUrl}" target="_blank" rel="noopener">${icon('ext')} cadastre.gouv.fr</a>

  /* ---- Carte cadastrale réelle (IGN Géoplateforme, via Leaflet) ---- */
  const IGN_WMTS = 'https://data.geopf.fr/wmts';
  function ignWmtsTemplate(layer, style, matrixSet, format){
    return `${IGN_WMTS}?SERVICE=WMTS&VERSION=1.0.0&REQUEST=GetTile&LAYER=${encodeURIComponent(layer)}&STYLE=${encodeURIComponent(style)}&TILEMATRIXSET=${matrixSet||'PM'}&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=${encodeURIComponent(format||'image/png')}`;
  }
  function lonLatToTileXYZ(lon, lat, z){
    const latRad = lat * Math.PI/180;
    const n = Math.pow(2, z);
    const x = Math.floor((lon+180)/360*n);
    const y = Math.floor((1 - Math.log(Math.tan(latRad) + 1/Math.cos(latRad))/Math.PI)/2*n);
    return { x: Math.max(0, Math.min(n-1, x)), y: Math.max(0, Math.min(n-1, y)), z };
  }
  let _mapAvailPromise = null;
  function checkMapTilesAvailable(){
    if (_mapAvailPromise) return _mapAvailPromise;
    _mapAvailPromise = new Promise((resolve) => {
      if (!window.L){ resolve(false); return; }
      const t = lonLatToTileXYZ(2.3522, 48.8566, 10); // Paris — couverture ortho garantie
      const url = ignWmtsTemplate('ORTHOIMAGERY.ORTHOPHOTOS','normal','PM','image/jpeg')
        .replace('{z}', t.z).replace('{y}', t.y).replace('{x}', t.x);
      const img = new Image();
      let settled = false;
      const finish = (ok) => { if (settled) return; settled = true; resolve(ok); };
      img.onload = () => finish(true);
      img.onerror = () => finish(false);
      setTimeout(() => finish(false), 4500);
      img.src = url;
    });
    return _mapAvailPromise;
  }
  async function mountCadastreMap(d){
    const lat = parseFloat(d.lat), lng = parseFloat(d.lng);

        }).addTo(map);
        setTimeout(() => { try{ map.invalidateSize(); }catch(e){} }, 150);
      }catch(e){ /* la carte reste en schéma si Leaflet échoue à l'initialisation */ }
    });
  }


  /* ---- Schéma synoptique hydraulique — généré à partir de 3 paramètres
     (bâtiments, chaudières, vannes). Style schématique volontairement
     simplifié : l'objectif est une allure de principe reconnaissable, pas
     un plan hydraulique exact. ---- */
  function synopticSvg(nbBatIn, nbChaufIn, nbVannesIn){
    const nbBat = Math.max(1, Math.min(8, Math.round(nbBatIn) || 1));
    const nbChauf = Math.max(1, Math.min(4, Math.round(nbChaufIn) || 1));
    const nbVannes = Math.max(1, Math.min(12, Math.round(nbVannesIn) || 1));

    const RED = '#c23b3b', BLUE = '#2a5fb0', INK = '#20272a';
    const colW = 128;
    const headerStartX = 232;
    const redY = 300, blueY = 366;
    const pumpBoxY = 40, pumpBoxH = 34;
    const avantValveY = 168, retourValveY = 232;
    const width = headerStartX + nbVannes * colW + 46;
    let height = 410;

    // Répartit les colonnes de vannes entre les bâtiments (le plus
    // régulièrement possible).
    const groups = Math.min(nbBat, nbVannes);
    const base = Math.floor(nbVannes / groups), extra = nbVannes % groups;
    const groupSizes = [];
    for (let g = 0; g < groups; g++) groupSizes.push(base + (g < extra ? 1 : 0));

    function pumpIcon(cx, cy, r){
      return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="${INK}" stroke-width="1.4"/>
        <path d="M${cx-r*0.42},${cy-r*0.5} L${cx+r*0.5},${cy} L${cx-r*0.42},${cy+r*0.5} Z" fill="${INK}"/>`;
    }
    function valveIcon(cx, cy, color, stem){
      let s = `<path d="M${cx-9},${cy-6} L${cx},${cy} L${cx-9},${cy+6} Z M${cx+9},${cy-6} L${cx},${cy} L${cx+9},${cy+6} Z" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/>`;
      if (stem){
        s += `<line x1="${cx}" y1="${cy-6}" x2="${cx}" y2="${cy-13}" stroke="${color}" stroke-width="1.6"/>
          <line x1="${cx-5}" y1="${cy-13}" x2="${cx+5}" y2="${cy-13}" stroke="${color}" stroke-width="1.6"/>`;
      }
      return s;
    }
    function taUnderline(cx, cy, color){
      return `<line x1="${cx-7}" y1="${cy+12}" x2="${cx+7}" y2="${cy+12}" stroke="${color}" stroke-width="1.3"/>
        <line x1="${cx-7}" y1="${cy+15.5}" x2="${cx+7}" y2="${cy+15.5}" stroke="${color}" stroke-width="1.3"/>`;
    }

    // Chaufferie : chaudière(s) empilée(s) à gauche. Ancrée près du
    // collecteur départ ; la hauteur totale du schéma s'ajuste ensuite
    // pour ne jamais rogner la pile (jusqu'à 4 chaudières).
    const boilerW = 92, boilerGap = 8, boilerH = 54;
    const boilersTotalH = nbChauf*boilerH + (nbChauf-1)*boilerGap;
    const boilerX = 16;
    const boilerY0 = redY - 16;
    let boilerHtml = '';
    for (let b=0; b<nbChauf; b++){
      const by = boilerY0 + b*(boilerH+boilerGap);
      boilerHtml += `
        <rect x="${boilerX}" y="${by}" width="${boilerW}" height="${boilerH}" fill="#fff" stroke="${INK}" stroke-width="4"/>
        <rect x="${boilerX+9}" y="${by+5}" width="${boilerW-18}" height="${boilerH/2-8}" fill="none" stroke="${INK}" stroke-width="1.2"/>
        <rect x="${boilerX+9}" y="${by+boilerH/2+3}" width="${boilerW-18}" height="${boilerH/2-8}" fill="none" stroke="${INK}" stroke-width="1.2"/>
      `;
    }
    const boilerMidY = boilerY0 + boilersTotalH/2;
    height = Math.max(height, boilerY0 + boilersTotalH + 24);

    // Purgeur au-dessus de la chaufferie.
    const ventX = boilerX + 24, ventTopY = Math.max(4, boilerY0 - 30);
    const ventHtml = `
      <line x1="${ventX}" y1="${boilerY0}" x2="${ventX}" y2="${ventTopY+14}" stroke="${INK}" stroke-width="1.2"/>
      ${valveIcon(ventX, ventTopY+16, INK, false)}
      <rect x="${ventX-5}" y="${ventTopY}" width="10" height="8" fill="none" stroke="${INK}" stroke-width="1.1"/>
    `;

    // Pompe de circulation + filtre, sur le retour, entre chaufferie et collecteurs.
    const pumpX = boilerX + boilerW + 46, pumpY = blueY;
    const pumpHtml = `
      ${pumpIcon(pumpX, pumpY, 14)}
      <rect x="${pumpX+16}" y="${pumpY-8}" width="15" height="16" fill="#fff" stroke="${INK}" stroke-width="1.3"/>
    `;

    // Raccordements chaufferie <-> collecteurs (départ rouge / retour bleu).
    const connHtml = `
      <line x1="${boilerX+boilerW}" y1="${boilerMidY}" x2="${headerStartX}" y2="${boilerMidY}" stroke="${RED}" stroke-width="2.4"/>
      <line x1="${headerStartX}" y1="${boilerMidY}" x2="${headerStartX}" y2="${redY}" stroke="${RED}" stroke-width="2.4"/>
      <line x1="${pumpX+31}" y1="${pumpY}" x2="${headerStartX}" y2="${pumpY}" stroke="${BLUE}" stroke-width="2.4"/>
      <line x1="${headerStartX}" y1="${pumpY}" x2="${headerStartX}" y2="${blueY}" stroke="${BLUE}" stroke-width="2.4"/>
      <line x1="${boilerX}" y1="${pumpY}" x2="${pumpX-14}" y2="${pumpY}" stroke="${BLUE}" stroke-width="2.4"/>
    `;

    // Collecteurs horizontaux (départ / retour).
    const headerEndX = headerStartX + (nbVannes-1)*colW + colW/2 + 10;
    const headerHtml = `
      <line x1="${headerStartX}" y1="${redY}" x2="${headerEndX}" y2="${redY}" stroke="${RED}" stroke-width="2.4"/>
      <line x1="${headerStartX}" y1="${blueY}" x2="${headerEndX}" y2="${blueY}" stroke="${BLUE}" stroke-width="2.4"/>
    `;

    // Colonnes (une par vanne), regroupées visuellement par bâtiment.
    let colsHtml = '';
    let groupLabelsHtml = '';
    let colIndex = 0;
    groupSizes.forEach((size, gi) => {
      if (!size) return;
      const groupStartX = headerStartX + colIndex*colW;
      for (let k=0; k<size; k++, colIndex++){
        const cx = headerStartX + colIndex*colW + colW/2;
        const cxRed = cx - 11, cxBlue = cx + 11;
        const taNum = colIndex + 1;
        colsHtml += `
          <line x1="${cxRed}" y1="${redY}" x2="${cxRed}" y2="${pumpBoxY+pumpBoxH}" stroke="${RED}" stroke-width="2.2"/>
          <line x1="${cxBlue}" y1="${blueY}" x2="${cxBlue}" y2="${pumpBoxY+pumpBoxH}" stroke="${BLUE}" stroke-width="2.2"/>
          <rect x="${cx-30}" y="${pumpBoxY}" width="60" height="${pumpBoxH}" rx="4" fill="#fff" stroke="${INK}" stroke-width="1.4"/>
          ${pumpIcon(cx-14, pumpBoxY+pumpBoxH/2, 9)}
          ${pumpIcon(cx+14, pumpBoxY+pumpBoxH/2, 9)}
          <path d="M${cxRed},${pumpBoxY+pumpBoxH+2} l-4,7 h8 z" fill="${RED}"/>
          <path d="M${cxBlue},${pumpBoxY+pumpBoxH+2} l-4,7 h8 z" fill="${BLUE}"/>
          ${valveIcon(cxRed, avantValveY, RED, true)}
          ${valveIcon(cxBlue, retourValveY, BLUE, false)}
          ${taUnderline(cxBlue, retourValveY, BLUE)}
          <text x="${cxBlue+13}" y="${retourValveY+4}" font-size="12" font-family="var(--font-mono, monospace)" fill="${INK}">TA ${taNum}</text>
        `;
      }
      const groupEndX = headerStartX + colIndex*colW;
      const groupMidX = (groupStartX + groupEndX) / 2;
      groupLabelsHtml += `
        <text x="${groupMidX}" y="16" font-size="12.5" font-weight="700" text-anchor="middle" fill="${INK}">Bâtiment ${gi+1}</text>
        <line x1="${groupStartX+10}" y1="24" x2="${groupEndX-10}" y2="24" stroke="${INK}" stroke-width="1" opacity="0.35"/>
      `;
    });

    return `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
      ${groupLabelsHtml}
      ${connHtml}
      ${headerHtml}
      ${colsHtml}
      ${boilerHtml}
      ${ventHtml}
      ${pumpHtml}
    </svg>`;
  }

  function renderSynopticPreview(){
    const el = document.getElementById('synop-preview');
    if (!el) return;
    const s = S.draft.synoptique || {};
    const nbBat = parseInt(s.nbBatiments, 10);
    const nbChauf = parseInt(s.nbChauffage, 10);
    const nbVannes = parseInt(s.nbVannes, 10);
    if (!nbBat && !nbChauf && !nbVannes){
      el.innerHTML = `<div class="geo-caption" style="text-align:center; padding:20px 0;">Renseignez les 3 champs ci-dessus pour générer le schéma.</div>`;
      return;
    }
    el.innerHTML = synopticSvg(nbBat || 1, nbChauf || 1, nbVannes || 1);
  }

  // Reconnaissance vocale (Web Speech API) : dicte un nombre dans un champ.
  // Indisponible dans certains contextes (notamment l'aperçu Artifact en
  // bac à sable) — on se dégrade alors proprement vers un message explicite
  // plutôt que de faire planter le bouton.
  const FR_NUMBER_WORDS = {
    zéro:0, zero:0, un:1, une:1, deux:2, trois:3, quatre:4, cinq:5, six:6,
    sept:7, huit:8, neuf:9, dix:10, onze:11, douze:12,
  };
  function parseSpokenNumber(text){
    const digits = String(text||'').match(/\d+/);
    if (digits) return parseInt(digits[0], 10);
    const word = String(text||'').toLowerCase().trim().split(/\s+/)[0];
    if (word in FR_NUMBER_WORDS) return FR_NUMBER_WORDS[word];
    return null;
  }
  function attachSynopticControls(){
    const main = document.getElementById('main');
    const d = S.draft;
    ['nbBatiments','nbChauffage','nbVannes'].forEach(key => {
      const input = main.querySelector(`[name="synoptique.${key}"]`);
      if (!input) return;
      input.addEventListener('input', () => {
        d.synoptique[key] = input.value;
        renderSynopticPreview();
      });
    });

    const hint = document.getElementById('synop-mic-hint');
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    main.querySelectorAll('.mic-btn[data-mic]').forEach(btn => {
      if (!SpeechRec){
        btn.addEventListener('click', () => {
          if (hint) hint.textContent = "Dictée vocale indisponible ici — fonctionne une fois le site auto-hébergé, dans un navigateur compatible (Chrome).";
        });
        return;
      }
      btn.addEventListener('click', () => {
        const key = btn.dataset.mic;
        const input = main.querySelector(`[name="synoptique.${key}"]`);
        if (!input) return;
        let rec;
        try{ rec = new SpeechRec(); }
        catch(e){ if (hint) hint.textContent = 'Dictée vocale indisponible ici.'; return; }
        rec.lang = 'fr-FR';
        rec.interimResults = false;
        rec.maxAlternatives = 3;
        btn.classList.add('listening');
        if (hint) hint.textContent = 'Écoute… dites un nombre (ex. « quatre »).';
        rec.onresult = (e) => {
          const transcript = e.results && e.results[0] && e.results[0][0] ? e.results[0][0].transcript : '';
          const n = parseSpokenNumber(transcript);
          if (n != null){
            input.value = n;
            d.synoptique[key] = String(n);
            renderSynopticPreview();
            if (hint) hint.textContent = `Compris : « ${transcript} » → ${n}.`;
          } else if (hint){
            hint.textContent = `Je n'ai pas compris de nombre dans « ${transcript} ». Réessayez ou tapez la valeur.`;
          }
        };
        rec.onerror = () => {
          if (hint) hint.textContent = "Dictée vocale indisponible (micro refusé, ou service injoignable ici — fonctionne une fois le site auto-hébergé).";
        };
        rec.onend = () => { btn.classList.remove('listening'); };
        try{ rec.start(); }
        catch(e){ btn.classList.remove('listening'); if (hint) hint.textContent = 'Dictée vocale indisponible ici.'; }
      });
    });
  }

  function cadastreSvg(seedStr){
    const h = seedHash(seedStr || 'x');
    // Deterministic simple (non self-intersecting) parcel: points placed at
    // strictly increasing angles around the centroid, radius jittered per seed.
    const cx=100, cy=72, baseR=42, sides=6;
    const pts = [];
    for (let i=0;i<sides;i++){
      const jitter = ((h >> (i*3)) % 100) / 100;           // 0..1
      const angle = (i/sides) * Math.PI*2 + (((h>>i)%10)/10 - 0.5) * (Math.PI*2/sides)*0.5;
      const r = baseR * (0.72 + jitter*0.4);
      pts.push([cx + Math.cos(angle)*r, cy + Math.sin(angle)*r*0.86]);
    }
    const poly = pts.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    let grid = '';
    for (let x=0; x<=200; x+=20) grid += `<line x1="${x}" y1="0" x2="${x}" y2="152" />`;
    for (let y=0; y<=152; y+=20) grid += `<line x1="0" y1="${y}" x2="200" y2="${y}" />`;
    return `
    <svg viewBox="0 0 200 152" style="width:100%; height:auto; border-radius:8px; background:var(--surface-2); border:1px solid var(--line);">
      <g stroke="var(--line)" stroke-width="1">${grid}</g>
      <polygon points="${poly}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="${cx}" cy="${cy}" r="2" fill="var(--accent)"/>
      <g transform="translate(172,18)" stroke="var(--ink-muted)" fill="var(--ink-muted)">
        <line x1="0" y1="10" x2="0" y2="-8" stroke-width="1.4"/>
        <polygon points="0,-12 -3.5,-5 3.5,-5" stroke="none"/>
        <text x="0" y="20" font-size="8" text-anchor="middle" fill="var(--ink-muted)" stroke="none" font-family="var(--font-mono)">N</text>
      </g>
      <g font-family="var(--font-mono)" font-size="8" fill="var(--ink-muted)" stroke="none">
        <line x1="14" y1="136" x2="54" y2="136" stroke="var(--ink-muted)" stroke-width="1"/>
        <text x="14" y="147">≈ 50 m</text>
      </g>
    </svg>`;
  }

  /* ---- Grouped bar chart (avant / après), SVG, with hover + table fallback ---- */
  function renderChart(d, s){
    const holder = document.getElementById('chart-holder');
    if (!holder) return;
    const rows = s.rows;
    if (S.chartTable[d.id]){
      holder.innerHTML = `
        <div class="table-scroll">
          <table>
            <thead><tr><th>Point de mesure</th><th>Avant (°C)</th><th>Après (°C)</th></tr></thead>
            <tbody>${rows.map(r => `<tr><td>${esc(r.label)}</td><td class="mono">${fmt1(r.avant)}</td><td class="mono">${fmt1(r.apres)}</td></tr>`).join('')}</tbody>
          </table>
        </div>`;
      return;
    }

    const W = 640, H = 310, padL = 34, padR = 14, padT = 12, padB = 50;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const maxVal = Math.max(30, Math.ceil((Math.max(...rows.map(r=>Math.max(r.avant,r.apres)), 10) + 3) / 5) * 5);
    const y = v => padT + plotH - (v / maxVal) * plotH;
    const n = rows.length;
    const groupW = plotW / n;
    const barW = Math.min(26, groupW * 0.28);
    const gap = 6;

    let gridLines = '', ticks = '';
    for (let v=0; v<=maxVal; v+=5){
      gridLines += `<line x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`;
      ticks += `<text x="${padL-8}" y="${y(v)+3}" text-anchor="end" font-size="9.5" font-family="var(--font-mono)" fill="var(--ink-muted)">${v}°</text>`;
    }

    let bars = '', labels = '';
    rows.forEach((r, i) => {
      const gx = padL + i*groupW + groupW/2;
      const xa = gx - gap/2 - barW;
      const xb = gx + gap/2;
      const ya = y(r.avant), yb = y(r.apres);
      bars += `
        <rect class="bar" data-tip="${esc(r.label)} — avant : ${fmt1(r.avant)} °C" x="${xa}" y="${ya}" width="${barW}" height="${padT+plotH-ya}" rx="3" fill="var(--cold)"/>
        <rect class="bar" data-tip="${esc(r.label)} — après : ${fmt1(r.apres)} °C" x="${xb}" y="${yb}" width="${barW}" height="${padT+plotH-yb}" rx="3" fill="var(--warm)"/>
        <text x="${xa+barW/2}" y="${ya-5}" text-anchor="middle" font-size="9" font-family="var(--font-mono)" fill="var(--ink-secondary)">${fmt1(r.avant)}</text>
        <text x="${xb+barW/2}" y="${yb-5}" text-anchor="middle" font-size="9" font-family="var(--font-mono)" fill="var(--ink-secondary)">${fmt1(r.apres)}</text>
      `;
      labels += wrapSvgLabel(r.label, gx, H-padB+15, 11, 9.5);
    });

    holder.innerHTML = `
      <div style="position:relative;">
        <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; overflow:visible;" id="bar-svg">
          <g>${gridLines}</g>
          <line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" stroke="var(--line-strong)" stroke-width="1.2"/>
          <g>${ticks}</g>
          <g>${bars}</g>
          <g>${labels}</g>
        </svg>
        <div id="chart-tip" style="position:absolute; pointer-events:none; opacity:0; transition:opacity .1s; background:var(--ink-primary); color:var(--page); font-size:11px; font-weight:600; padding:5px 9px; border-radius:6px; white-space:nowrap; transform:translate(-50%,-115%); z-index:5;"></div>
      </div>
    `;
    const svg = document.getElementById('bar-svg');
    const tip = document.getElementById('chart-tip');
    svg.querySelectorAll('.bar').forEach(bar => {
      bar.addEventListener('mousemove', (e) => {
        const rect = svg.getBoundingClientRect();
        const x = e.clientX - rect.left, ty = e.clientY - rect.top;
        tip.textContent = bar.getAttribute('data-tip');
        tip.style.left = x + 'px'; tip.style.top = ty + 'px';
        tip.style.opacity = 1;
      });
      bar.addEventListener('mouseleave', () => { tip.style.opacity = 0; });
    });
  }

  /* ============================= EXPORT PDF ============================= */
  /* Mise en page inspirée d'un rapport de réglage d'équilibrage papier type :
     page de garde avec cadre titre + tableaux d'identification + signatures,
     photos, tableau de relevé d'équilibrage, tableau des points de mesure
     avec synthèse, tableaux + courbes des campagnes avant/après, synthèse
     finale du dossier. */
  const PDF_C = {
    ink:[18,24,26], inkSoft:[75,86,88], inkMuted:[124,134,136],
    line:[215,220,218], lineStrong:[185,192,190],
    accent:[201,105,27], accentSoft:[244,227,208],
    cold:[42,108,168], coldSoft:[219,233,244],
    good:[12,163,12], goodSoft:[224,243,223],
    critical:[197,58,58], criticalSoft:[251,225,225],
    surface2:[246,247,246],
  };
  const PDF_PALETTE = [
    [42,120,214],[235,104,52],[27,175,122],[237,161,0],[232,123,164],[74,58,167],[227,73,72],
  ];

  function pdfAvailable(){ return !!(window.jspdf && window.jspdf.jsPDF); }
  function pdfNewDoc(orientation){
    const { jsPDF } = window.jspdf;
    return new jsPDF({ unit:'mm', format:'a4', orientation: orientation || 'portrait' });
  }

  function pdfBrandHeader(doc, title){
    const w = doc.internal.pageSize.getWidth();
    doc.setFillColor(...PDF_C.accent);
    doc.rect(14, 10, 2.6, 11, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(...PDF_C.ink);
    doc.text('CALORIF SUIVI', 19.5, 16.5);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...PDF_C.inkMuted);
    doc.text('SUIVI CALORIFUGEAGE', 19.5, 20.3);
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...PDF_C.inkSoft);
    doc.text(title, w-14, 17, { align:'right' });
    doc.setDrawColor(...PDF_C.line); doc.setLineWidth(0.4);
    doc.line(14, 25, w-14, 25);
    return 33;
  }

  function pdfFooter(doc){
    const pages = doc.internal.getNumberOfPages();
    const w = doc.internal.pageSize.getWidth();
    const h = doc.internal.pageSize.getHeight();
    for (let i=1;i<=pages;i++){
      doc.setPage(i);
      doc.setDrawColor(...PDF_C.line); doc.setLineWidth(0.3);
      doc.line(14, h-14, w-14, h-14);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...PDF_C.inkMuted);
      doc.text('Maquette CRM — document généré automatiquement, à usage de démonstration.', 14, h-10);
      doc.text(`Page ${i} / ${pages}`, w-14, h-10, { align:'right' });
    }
  }

  function pdfSectionBox(doc, x, y, w, text){
    doc.setDrawColor(...PDF_C.lineStrong); doc.setLineWidth(0.4);
    doc.rect(x, y, w, 8);
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(...PDF_C.ink);
    doc.text(text, x + w/2, y + 5.6, { align:'center' });
    return y + 8;
  }

  function pdfInfoTable(doc, x, y, w, rows){
    doc.autoTable({
      startY: y, margin:{ left:x, right: doc.internal.pageSize.getWidth()-x-w },
      tableWidth: w, theme:'grid',
      styles:{ font:'helvetica', fontSize:8.5, textColor: PDF_C.ink, cellPadding:2.6, lineColor: PDF_C.line, lineWidth:0.25 },
      columnStyles:{ 0:{ fillColor: PDF_C.surface2, fontStyle:'bold', cellWidth: w*0.38 } },
      body: rows,
    });
    return doc.lastAutoTable.finalY;
  }

  function pdfSignatureBlock(doc, x, y, w, h){
    const gap = 4, colW = (w - gap) / 2;
    [['Signature et cachet — entreprise', x], ['Signature et cachet — client', x + colW + gap]].forEach(([label, cx]) => {
      doc.setFillColor(...PDF_C.ink);
      doc.rect(cx, y, colW, 7, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(255,255,255);
      doc.text(label, cx+3, y+4.7);
      doc.setDrawColor(...PDF_C.line); doc.setLineWidth(0.3); doc.setFillColor(...PDF_C.surface2);
      doc.rect(cx, y+7, colW, h-7, 'FD');
    });
    return y + h;
  }

  function pdfLineChart(doc, x, y, w, h, title, pointLabels, series){
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(...PDF_C.ink);
    doc.text(title, x, y);
    const top = y + 4, chartH = h - 15, chartW = w;
    const allVals = series.flatMap(s => s.values.filter(v => v!=null && !isNaN(v)).map(Number));
    const maxV = Math.max(30, ...(allVals.length?[Math.ceil(Math.max(...allVals)/5)*5]:[30]));
    const minV = 0;
    doc.setDrawColor(...PDF_C.line); doc.setLineWidth(0.15);
    for (let t=minV; t<=maxV; t+=5){
      const gy = top + chartH - (t-minV)/(maxV-minV)*chartH;
      doc.line(x, gy, x+chartW, gy);
      doc.setFont('helvetica','normal'); doc.setFontSize(6.3); doc.setTextColor(...PDF_C.inkMuted);
      doc.text(t+'°', x-2, gy+1, { align:'right' });
    }
    doc.setDrawColor(...PDF_C.lineStrong); doc.setLineWidth(0.3);
    doc.rect(x, top, chartW, chartH);
    const n = pointLabels.length;
    const stepX = n>1 ? chartW/(n-1) : chartW/2;
    pointLabels.forEach((lbl,i) => {
      const gx = n>1 ? x + stepX*i : x + chartW/2;
      doc.setFont('helvetica','normal'); doc.setFontSize(6.3); doc.setTextColor(...PDF_C.inkMuted);
      doc.text(String(lbl), gx, top+chartH+4.2, { align:'center', maxWidth: Math.max(stepX,18) });
    });
    series.forEach(s => {
      doc.setDrawColor(...s.color); doc.setLineWidth(0.6);
      let prev = null;
      s.values.forEach((v,i) => {
        if (v==null || isNaN(v)){ prev = null; return; }
        const gx = n>1 ? x + stepX*i : x + chartW/2;
        const gy = top + chartH - (Number(v)-minV)/(maxV-minV)*chartH;
        if (prev) doc.line(prev[0], prev[1], gx, gy);
        doc.setFillColor(...s.color); doc.circle(gx, gy, 0.7, 'F');
        prev = [gx, gy];
      });
    });
    let lx = x, ly = top+chartH+9.5;
    doc.setFont('helvetica','normal'); doc.setFontSize(6.5);
    series.forEach(s => {
      doc.setFillColor(...s.color); doc.rect(lx, ly-2.1, 3, 2, 'F');
      doc.setTextColor(...PDF_C.inkSoft);
      doc.text(s.label, lx+4, ly);
      lx += doc.getTextWidth(s.label) + 12;
    });
    return top + chartH + 13;
  }

  function pdfLoadImage(dataUrl){
    return new Promise((resolve) => {
      if (!dataUrl){ resolve(null); return; }
      const img = new Image();
      img.onload = () => resolve({ el: img, w: img.naturalWidth || 1, h: img.naturalHeight || 1 });
      img.onerror = () => resolve(null);
      img.src = dataUrl;
    });
  }

  function pdfPhotoCell(doc, x, y, w, h, label, imgInfo){
    doc.setDrawColor(...PDF_C.lineStrong); doc.setLineWidth(0.3);
    doc.setFillColor(...PDF_C.surface2);
    doc.rect(x, y, w, h, 'FD');
    if (imgInfo){
      const pad = 2.5;
      const availW = w - pad*2, availH = h - pad*2 - 6;
      const ratio = Math.min(availW/imgInfo.w, availH/imgInfo.h);
      const dw = imgInfo.w*ratio, dh = imgInfo.h*ratio;
      const dx = x + (w-dw)/2, dy = y + pad + (availH-dh)/2;
      try{ doc.addImage(imgInfo.el, 'JPEG', dx, dy, dw, dh); }catch(e){}
    } else {
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...PDF_C.inkMuted);
      doc.text('Aucune photo', x+w/2, y+h/2 - 3, { align:'center' });
    }
    doc.setFont('helvetica','bold'); doc.setFontSize(7.6); doc.setTextColor(...PDF_C.inkSoft);
    doc.text(label, x+w/2, y+h-3.5, { align:'center' });
    return y + h;
  }

  function pdfLogRows(logs){
    return (logs||[]).map(r => [
      r.date||'—', r.heure||'—', r.tExt??'—',
      ...([0,1,2,3,4].map(i => (r.amb && r.amb[i]!=null) ? r.amb[i] : '—')),
      r.ecartMax??'—',
    ]);
  }

  async function buildReportPdf(d, s){
    const doc = pdfNewDoc('portrait');
    const pageW = doc.internal.pageSize.getWidth();
    const marginX = 14;
    const contentW = pageW - marginX*2;
    const statusLabel = (STATUS[d.statut] && STATUS[d.statut].label) || d.statut;

    /* ---- Page 1 : garde ---- */
    let y = pdfBrandHeader(doc, `Rapport d'intervention · ${d.numero || '—'}`);
    doc.setDrawColor(...PDF_C.cold); doc.setLineWidth(0.6);
    doc.rect(marginX, y, contentW, 20);
    doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(...PDF_C.ink);
    doc.text(`DOSSIER N° ${d.numero || '—'}`, marginX + contentW/2, y + 8.5, { align:'center' });
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...PDF_C.inkSoft);
    doc.text("Réglage des organes d'équilibrage d'une installation de chauffage à eau chaude", marginX + contentW/2, y + 15.5, { align:'center', maxWidth: contentW-10 });
    y += 26;

    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...PDF_C.ink);
    doc.text(`Statut du suivi : ${statusLabel}`, marginX, y+5);
    y += 10;

    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(...PDF_C.ink);
    doc.text('Information sur le site', marginX, y+4);
    y += 6;
    y = pdfInfoTable(doc, marginX, y, contentW, [
      ['Résidence / client', d.residence || d.client.nom || '—'],
      ['Adresse postale', [d.adresse.rue, [d.adresse.cp, d.adresse.ville].filter(Boolean).join(' ')].filter(Boolean).join(' — ') || '—'],
      ['Référence cadastrale', d.refCadastrale || '—'],
      ['Type de chauffage', d.typeLogement.typeEnergie || '—'],
      ['Nombre de logements', d.typeLogement.nbLogements || '—'],
      ['Surface chauffée', d.typeLogement.surfaceM2 ? d.typeLogement.surfaceM2 + ' m²' : '—'],
      ['Nombre de sous-stations', d.typeLogement.nbSousStations || '—'],
    ]);
    y += 8;

    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(...PDF_C.ink);
    doc.text("Information sur l'intervention", marginX, y+4);
    y += 6;
    y = pdfInfoTable(doc, marginX, y, contentW, [
      ["Date d'intervention", d.dateIntervention || '—'],
      ['Technicien assigné', userName(d.technicienId) || 'non assigné'],
      ['Température extérieure relevée', d.typeLogement.tempExterieure !== '' && d.typeLogement.tempExterieure!=null ? d.typeLogement.tempExterieure + '°C' : '—'],
      ['Contact client', [d.client.nom, d.client.telephone].filter(Boolean).join(' — ') || '—'],
      ['Gardien sur place', [d.gardien.nom, d.gardien.telephone].filter(Boolean).join(' — ') || '—'],
    ]);
    y += 10;

    pdfSignatureBlock(doc, marginX, y, contentW, 32);

    /* ---- Page 2 : photos ---- */
    doc.addPage();
    y = pdfBrandHeader(doc, 'Photos de l\'intervention');
    y = pdfSectionBox(doc, marginX, y, contentW, 'PHOTOS');
    y += 6;
    const [imgBat, imgChauff, imgTemp] = await Promise.all([
      pdfLoadImage(d.photos.batiment), pdfLoadImage(d.photos.chaufferie), pdfLoadImage(d.photos.temperature),
    ]);
    const cellW = (contentW - 8) / 3, cellH = 70;
    pdfPhotoCell(doc, marginX, y, cellW, cellH, 'Bâtiment', imgBat);
    pdfPhotoCell(doc, marginX + cellW + 4, y, cellW, cellH, 'Chaufferie', imgChauff);
    pdfPhotoCell(doc, marginX + (cellW+4)*2, y, cellW, cellH, 'Température extérieure', imgTemp);
    y += cellH + 12;
    if (d.notes){
      doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(...PDF_C.ink);
      doc.text('Notes', marginX, y); y += 5;
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...PDF_C.inkSoft);
      doc.text(d.notes, marginX, y, { maxWidth: contentW });
    }

    /* ---- Page 3 : relevé d'équilibrage (paysage) ---- */
    doc.addPage('a4','landscape');
    const pageWL = doc.internal.pageSize.getWidth();
    const contentWL = pageWL - marginX*2;
    y = pdfBrandHeader(doc, "Relevé d'équilibrage des vannes");
    y = pdfSectionBox(doc, marginX, y, contentWL, "TABLEAU DE RELEVÉ D'ÉQUILIBRAGE");
    y += 4;
    doc.autoTable({
      startY: y, margin:{ left:marginX, right:marginX }, theme:'grid',
      styles:{ font:'helvetica', fontSize:7.6, textColor:PDF_C.ink, cellPadding:2, lineColor:PDF_C.line, lineWidth:0.2, halign:'center', valign:'middle' },
      headStyles:{ fillColor:PDF_C.ink, textColor:255, fontStyle:'bold', fontSize:7.6 },
      head: [
        [
          {content:'Repérage\nvanne', rowSpan:2}, {content:'Sonde\nambiance', rowSpan:2}, {content:'Marque', rowSpan:2}, {content:'Type', rowSpan:2}, {content:'DN', rowSpan:2},
          {content:'Mesure avant équilibrage', colSpan:4}, {content:'Débit\nthéo. visé\n(L/h)', rowSpan:2},
          {content:'Mesure après équilibrage', colSpan:4},
        ],
        ['Débit L/h','Tours','T° Dép.','T° Ret.','Débit L/h','Tours','T° Dép.','T° Ret.'],
      ],
      body: (d.vannes||[]).map(v => [
        v.reperage||'—', v.sonde==='oui'?'Oui':'Non', v.marque||'—', v.type||'—', v.dn||'—',
        v.avant.debit??'—', v.avant.tours??'—', v.avant.tDepart??'—', v.avant.tRetour??'—',
        v.debitTheoriqueVise??'—',
        v.apres.debit??'—', v.apres.tours??'—', v.apres.tDepart??'—', v.apres.tRetour??'—',
      ]),
    });

    /* ---- Page 4 : points de mesure + synthèse ---- */
    doc.addPage('a4','portrait');
    y = pdfBrandHeader(doc, 'Points de mesure — température ambiante');
    y = pdfSectionBox(doc, marginX, y, contentW, "TABLEAU D'ENREGISTREMENT DES TEMPÉRATURES");
    y += 4;
    doc.autoTable({
      startY: y, margin:{ left:marginX, right:marginX }, theme:'grid',
      styles:{ font:'helvetica', fontSize:8.5, textColor:PDF_C.ink, cellPadding:2.4, lineColor:PDF_C.line, lineWidth:0.2 },
      headStyles:{ fillColor:PDF_C.cold, textColor:255, fontStyle:'bold' },
      head: [['Bâtiment','Niveau','Lieu','Exposition','Relevé T° (°C)']],
      body: (d.pointsTemp||[]).map(p => [p.batiment||'—', p.niveau||'—', p.lieu||'—', p.exposition||'—', p.releve??'—']),
    });
    y = doc.lastAutoTable.finalY + 8;

    const releves = (d.pointsTemp||[]).map(p => Number(p.releve)).filter(v => !isNaN(v));
    const tMin = releves.length ? Math.min(...releves) : null;
    const tMax = releves.length ? Math.max(...releves) : null;
    const delta = (tMin!=null && tMax!=null) ? (tMax - tMin) : null;
    const moyenne = releves.length ? releves.reduce((a,b)=>a+b,0)/releves.length : null;
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(...PDF_C.ink);
    doc.text('Synthèse des relevés', marginX, y); y += 5;
    doc.autoTable({
      startY: y, margin:{ left:marginX, right:marginX }, theme:'grid',
      styles:{ font:'helvetica', fontSize:8.5, cellPadding:3, halign:'center', lineColor:PDF_C.line, lineWidth:0.2 },
      headStyles:{ fillColor:PDF_C.surface2, textColor:PDF_C.ink, fontStyle:'bold' },
      head: [['T° min','T° max','Écart max','T° moyenne']],
      body: [[tMin!=null?fmt1(tMin)+'°C':'—', tMax!=null?fmt1(tMax)+'°C':'—', delta!=null?fmt1(delta)+'°C':'—', moyenne!=null?fmt1(moyenne)+'°C':'—']],
      didParseCell: (data) => {
        if (data.section==='body' && data.column.index===2){
          data.cell.styles.fillColor = PDF_C.critical;
          data.cell.styles.textColor = 255;
          data.cell.styles.fontStyle = 'bold';
        }
      },
    });

    /* ---- Pages 5/6 : campagnes avant / après ---- */
    const pointLabels = (d.pointsTemp||[]).map((p,i) => p.niveau || p.batiment || ('Pt '+(i+1)));
    [
      { key:'avant', title:'Températures — avant équilibrage', rows:d.logsAvant, head:'TABLEAU DES TEMPÉRATURES AVANT ÉQUILIBRAGE' },
      { key:'apres', title:'Températures — après équilibrage', rows:d.logsApres, head:'TABLEAU DES TEMPÉRATURES APRÈS ÉQUILIBRAGE' },
    ].forEach(section => {
      if (!section.rows || !section.rows.length) return;
      doc.addPage('a4','portrait');
      y = pdfBrandHeader(doc, section.title);
      y = pdfSectionBox(doc, marginX, y, contentW, section.head);
      y += 4;
      doc.autoTable({
        startY: y, margin:{ left:marginX, right:marginX }, theme:'grid',
        styles:{ font:'helvetica', fontSize:7.8, textColor:PDF_C.ink, cellPadding:2, lineColor:PDF_C.line, lineWidth:0.2, halign:'center' },
        headStyles:{ fillColor: section.key==='avant' ? PDF_C.cold : PDF_C.accent, textColor:255, fontStyle:'bold', fontSize:7.6 },
        head: [['Date','Heure','T° Ext', ...pointLabels.map((l,i)=>l||('Amb. '+(i+1))), 'Écart max']],
        body: pdfLogRows(section.rows),
      });
      y = doc.lastAutoTable.finalY + 10;
      const series = section.rows.map((r,i) => ({
        label: r.date || ('Relevé '+(i+1)),
        color: PDF_PALETTE[i % PDF_PALETTE.length],
        values: [0,1,2,3,4].map(idx => r.amb ? r.amb[idx] : null),
      }));
      if (pointLabels.length){
        pdfLineChart(doc, marginX, y, contentW, 78, 'Courbe des relevés — ' + section.title.split('—')[1].trim(), pointLabels, series);
      }
    });

    /* ---- Dernière page : synthèse finale ---- */
    doc.addPage('a4','portrait');
    y = pdfBrandHeader(doc, 'Synthèse du dossier');
    y = pdfSectionBox(doc, marginX, y, contentW, 'SYNTHÈSE — RAPPORT SYNOPTIQUE');
    y += 8;
    if (s){
      const kpis = [
        ['Écart de température — avant', fmt1(s.ecartAvant)+' °C'],
        ['Écart de température — après', fmt1(s.ecartApres)+' °C'],
        ["Réduction de l'écart entre points", (s.reduction>=0?'-':'+')+fmt1(Math.abs(s.reduction))+' %'],
        ['Gain moyen de température', (s.gainMoyen>=0?'+':'')+fmt1(s.gainMoyen)+' °C'],
      ];
      const cw = (contentW - 12) / 2;
      kpis.forEach((k,i) => {
        const kx = marginX + (i%2)*(cw+12), ky = y + Math.floor(i/2)*24;
        doc.setDrawColor(...PDF_C.lineStrong); doc.setLineWidth(0.3); doc.setFillColor(...PDF_C.surface2);
        doc.rect(kx, ky, cw, 20, 'FD');
        doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(...PDF_C.ink);
        doc.text(k[1], kx+5, ky+9);
        doc.setFont('helvetica','normal'); doc.setFontSize(7.6); doc.setTextColor(...PDF_C.inkMuted);
        doc.text(k[0], kx+5, ky+15.5, { maxWidth: cw-10 });
      });
      y += 54;
      doc.setFillColor(...(s.beneficial ? PDF_C.goodSoft : PDF_C.accentSoft));
      doc.setDrawColor(...(s.beneficial ? PDF_C.good : PDF_C.accent));
      doc.setLineWidth(0.4);
      doc.rect(marginX, y, contentW, 16, 'FD');
      doc.setFont('helvetica','bold'); doc.setFontSize(10);
      doc.setTextColor(...(s.beneficial ? PDF_C.good : PDF_C.accent));
      doc.text(s.beneficial ? 'OK — Calorifugeage jugé bénéfique' : '! Résultats à confirmer par une nouvelle campagne', marginX+6, y+10);
      y += 26;
    } else {
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...PDF_C.inkMuted);
      doc.text('Synthèse indisponible : compléter les points de mesure et au moins un relevé avant / après équilibrage.', marginX, y, { maxWidth: contentW });
      y += 16;
    }
    pdfSignatureBlock(doc, marginX, y, contentW, 32);

    pdfFooter(doc);
    return doc;
  }

  async function exportReport(d, s){
    if (!pdfAvailable()){
      toast("Export PDF indisponible (bibliothèque non chargée) — vérifiez la connexion.");
      return;
    }
    try{
      const doc = await buildReportPdf(d, s);
      const filename = `rapport-${(d.numero||'dossier').replace(/[^a-z0-9-]/gi,'_')}.pdf`;
      const blob = doc.output('blob');
      if (S.downloads){
        try{
          await S.downloads.save({ filename, data: blob });
          toast('Rapport PDF exporté.');
          return;
        }catch(e){ /* fall through to local */ }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
      toast('Rapport PDF exporté.');
    }catch(e){
      toast("Erreur lors de la génération du PDF.");
    }
  }

  /* ============================= BOOT ============================= */
  render();
  initCapabilities();

})();
</script>
